name: CI

# Runs on pull requests, and is the gate docker-publish.yml calls before it publishes
# anything, so the checks guarding a PR and the checks guarding a deploy can't drift apart.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The built app served by the real production server. The apps it reads are pointed at a
      # closed port, so this proves the page and the API answer even when every upstream is down.
      - name: Smoke test the production server
        run: |
          PORT=5499 ATRIUM_CLINCH=http://127.0.0.1:9 ATRIUM_CANTINA=http://127.0.0.1:9 ATRIUM_PULSE=http://127.0.0.1:9 ATRIUM_AALE=http://127.0.0.1:9 node server/server.mjs &
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:5499/healthz && break; sleep 0.5; done
          curl -sf http://127.0.0.1:5499/ | grep -q '<title>Atrium</title>'
          curl -sf http://127.0.0.1:5499/clinch | grep -q '<title>Atrium</title>'
          curl -sf http://127.0.0.1:5499/api/apps | grep -q '"slug":"clinch"'
          if curl -s http://127.0.0.1:5499/api/apps | grep -q '"slug":"census"'; then echo "::error::owner apps reached a guest"; exit 1; fi
          curl -sI http://127.0.0.1:5499/ | grep -qi "content-security-policy: default-src 'self'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5499/api/nope)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5499/assets/missing.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:5499/api/apps)" = 405
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:5499/api/cantina/photo?d=1')" = 404
          # Sign-in is off without its settings.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5499/login)" = 404
          # The Census forwarder is wired in; without ATRIUM_CENSUS it answers locally.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5499/_e.js)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST --data '{}' http://127.0.0.1:5499/_e)" = 204
          # Without Dashboard: the built-in wall, Clinch in its corner, and no owner app in a guest's layout.
          curl -sf http://127.0.0.1:5499/api/apps | grep -q '"wall":{"wide":{"columns":12,"web":{"clinch":\[1,1,6,3\]'
          # The page carries the built-in language and theme, and only those (the wall names the owner's
          # apps). The manifest isn't served for the same reason; the next step checks what's announced.
          curl -sf http://127.0.0.1:5499/ | grep -q '<script type="application/json" id="ewo-config">{"lang":"system","theme":"system"}</script>'
          curl -sf http://127.0.0.1:5499/clinch | grep -q 'id="ewo-config"'

      # The server against a stand-in for Dashboard's apps' port: it takes the manifest (the wall and
      # the family's language and theme), a tile moved there reaches /api/apps, and the family's dark
      # theme and English reach the page.
      - name: Smoke test Dashboard's layout
        run: |
          announced=$(mktemp)
          ANNOUNCED=$announced node --input-type=module -e "
            import http from 'node:http';
            import { readFileSync, writeFileSync } from 'node:fs';
            const wall = JSON.parse(readFileSync('server/wall.json', 'utf8'));
            [wall.wide.web.planum, wall.wide.web['aale-spiele']] = [wall.wide.web['aale-spiele'], wall.wide.web.planum];
            http.createServer((req, res) => {
              if (req.method === 'PUT' && req.url === '/v1/manifest/atrium') { let body = ''; req.on('data', (c) => (body += c)).on('end', () => (writeFileSync(process.env.ANNOUNCED, body), res.writeHead(204).end())); return; }
              if (req.url === '/v1/config/atrium') return res.writeHead(200, { 'content-type': 'application/json', etag: '\"1\"' }).end(JSON.stringify({ family: { theme: 'dark', lang: 'en' }, app: { wall } }));
              res.writeHead(404).end();
            }).listen(5498);
          " &
          for _ in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:5498/ && break; sleep 0.5; done
          DASHBOARD_URL=http://127.0.0.1:5498 PORT=5497 ATRIUM_CLINCH=http://127.0.0.1:9 ATRIUM_CANTINA=http://127.0.0.1:9 ATRIUM_PULSE=http://127.0.0.1:9 ATRIUM_AALE=http://127.0.0.1:9 node server/server.mjs &
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:5497/healthz && break; sleep 0.5; done
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:5497/api/apps | grep -q '"planum":\[10,1,3,2\]' && break; sleep 0.5; done
          curl -sf http://127.0.0.1:5497/api/apps | grep -q '"planum":\[10,1,3,2\]'
          grep -q '"lang":{"family":true},"theme":{"family":true}' "$announced"
          curl -sf http://127.0.0.1:5497/ | grep -q '<script type="application/json" id="ewo-config">{"lang":"en","theme":"dark"}</script>'
